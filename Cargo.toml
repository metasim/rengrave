[workspace]
resolver = "3"
members = ["crates/rengrave_core", "crates/rengrave_cli", "crates/rengrave_gui", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/metasim/rengrave"
authors = ["Simeon H.K. Fitch <simeon@metasim.net>"]

[workspace.dependencies]
rengrave_core = { path = "crates/rengrave_core" }
thiserror = "2"
clipper2-rust = "1.2"
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
harfrust = "0.12"
# Pinned exactly: results must not change between releases (see portable_math).
libm = "=0.2.16"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "pnm"] }
epaint_default_fonts = "0.37"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_kittest = "0.37"
rfd = "0.17"
approx = "0.5"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Stamping the tool into the stock is the hot path of the simulator.
[profile.dev.package.warp-sim]
opt-level = 3
