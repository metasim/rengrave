[workspace]
resolver = "3"
members = ["crates/rengrave_core", "crates/rengrave_cli", "crates/rengrave_gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/metasim/rengrave"
authors = ["Simeon H.K. Fitch <simeon@metasim.net>"]

[workspace.dependencies]
rengrave_core = { path = "crates/rengrave_core" }
thiserror = "2"
clipper2-rust = "1.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "pnm"] }
epaint_default_fonts = "0.37"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
egui_kittest = "0.37"
rfd = "0.17"
approx = "0.5"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
