[package]
name = "warp-tools"
description = "Cutting tool and holder library for WarpNine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.clippy]
all = "allow"
