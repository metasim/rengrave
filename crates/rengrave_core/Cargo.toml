[package]
name = "rengrave_core"
description = "Text and image engraving / V-carving toolpath engine (Rust port of F-Engrave)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = ["system-fonts"]
# Lists and loads the fonts installed on the machine.
system-fonts = ["dep:fontique"]

[dependencies]
thiserror.workspace = true
clipper2-rust.workspace = true
skrifa.workspace = true
image.workspace = true
fontique = { workspace = true, optional = true }
glam = "0.34"
warp-gcode = { path = "../../vendor/warp-gcode" }
warp-sim = { path = "../../vendor/warp-sim" }
warp-tools = { path = "../../vendor/warp-tools" }

[dev-dependencies]
approx.workspace = true
epaint_default_fonts.workspace = true

[lints]
workspace = true
