<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  SPDX-License-Identifier: GPL-3.0-or-later
  SPDX-FileCopyrightText: 2026 Simeon H.K. Fitch

  Rengrave application icon. 1024 x 1024 canvas; the tile is the standard macOS 824 x 824 body
  with a 100 px margin for the shadow. The R is a stroked path, so edit its shape with the Node
  tool; the three groove paths share one outline and must be changed together.
  Build the macOS icon set with tools/build-icon.sh.
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   width="1024"
   height="1024"
   viewBox="0 0 1024 1024"
   version="1.1"
   id="rengrave-icon">
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     inkscape:pagecheckerboard="true"
     inkscape:document-units="px"
     showgrid="false" />
  <title>Rengrave icon</title>
  <defs id="defs">
    <linearGradient id="wood" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e9c88f" id="wood-top" />
      <stop offset="1" stop-color="#c58f4f" id="wood-bottom" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="150%"
       color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Shadow" id="layer-shadow">
    <rect id="shadow" x="100" y="114" width="824" height="824" rx="185" ry="185"
       fill="#000000" fill-opacity="0.35" filter="url(#blur)" />
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Tile" id="layer-tile">
    <rect id="tile" x="100" y="100" width="824" height="824" rx="185" ry="185"
       fill="url(#wood)" />
    <rect id="tile-rim" x="100" y="100" width="824" height="824" rx="185" ry="185"
       fill="none" stroke="url(#rim)" stroke-width="4" />
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Groove" id="layer-groove"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="groove-edge" inkscape:label="Groove edge"
       d="M372 739 V285 H512 C600 285 652 330 652 400 C652 470 600 515 512 515 H372 M500 515 L652 739"
       stroke="#4a2a12" stroke-width="150" />
    <path id="groove-wall" inkscape:label="Groove wall"
       d="M372 739 V285 H512 C600 285 652 330 652 400 C652 470 600 515 512 515 H372 M500 515 L652 739"
       stroke="#7a4a22" stroke-width="96" />
    <path id="groove-bottom" inkscape:label="Groove bottom"
       d="M372 739 V285 H512 C600 285 652 330 652 400 C652 470 600 515 512 515 H372 M500 515 L652 739"
       stroke="#2b1608" stroke-width="22" />
  </g>
</svg>
