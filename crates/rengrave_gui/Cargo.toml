[package]
name = "rengrave_gui"
description = "egui desktop application for the rengrave G-code generator."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "rengrave"
path = "src/main.rs"

[lib]
name = "rengrave_gui"
path = "src/lib.rs"

[dependencies]
rengrave_core.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
image = { workspace = true }

[features]
# Enables the screenshot test, which needs a GPU: `cargo test -p rengrave_gui --features screenshots`.
screenshots = ["egui_kittest/wgpu", "egui_kittest/snapshot"]

[lints]
workspace = true

# Used by `cargo bundle --release -p rengrave_gui` to build a macOS `Rengrave.app`.
[package.metadata.bundle]
name = "Rengrave"
identifier = "net.metasim.rengrave"
short_description = "Engraving and V-carve G-code generator"
category = "public.app-category.graphics-design"
copyright = "Copyright 2026 Simeon H.K. Fitch. Licensed under GPL-3.0-or-later."
